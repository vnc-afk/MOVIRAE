name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Load environment variables
        run: |
          set -a
          if [ -f frontend/.env ]; then
            . frontend/.env
          fi
          set +a
          echo "DATABASE_URL=${DATABASE_URL:-${{ secrets.DATABASE_URL }}}" >> "$GITHUB_ENV"
          echo "DIRECT_URL=${DIRECT_URL:-${{ secrets.DIRECT_URL }}}" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build frontend
        run: npm run build

      - name: Run lint
        run: npm run lint
