name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: movirae_test
        options: >-
          --health-cmd "pg_isready -U ci -d movirae_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma validate

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run prisma:generate

      - name: Run tests
        run: npm test

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/movirae_test
          DIRECT_URL: postgresql://ci:ci@localhost:5432/movirae_test
        run: npx prisma migrate deploy

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/movirae_test
          DIRECT_URL: postgresql://ci:ci@localhost:5432/movirae_test
        run: npm run test:db

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Start BullMQ worker
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          timeout 10s npm run worker || test $? -eq 124

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run build
